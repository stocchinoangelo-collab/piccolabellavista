<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piccolabellavista · Guida privata alla Sardegna</title>
<meta name="description" content="Guida privata riservata agli ospiti di Piccolabellavista, Pirri/Cagliari.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PBV Guida">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<!-- FIX: icon.svg da solo non basta su iOS/Safari (apple-touch-icon SVG non è
     supportato in modo affidabile); aggiunte varianti PNG generate in
     img/icons/. Vedi CHANGELOG.md. -->
<link rel="apple-touch-icon" sizes="180x180" href="img/icons/apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" sizes="192x192" href="img/icons/icon-192.png">
<link rel="icon" sizes="512x512" href="img/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- GATE -->
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate__box">
    <div class="gate__logo">PBV</div>
    <h1 class="gate__title" id="gate-title">Piccolabellavista</h1>
    <p class="gate__subtitle" data-i18n="gate_text">Guida riservata agli ospiti</p>
    <div class="gate__input-wrap">
      <input type="password" id="gate-pass" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password" inputmode="text">
    </div>
    <button class="btn btn--primary btn--full" id="gate-btn" data-i18n="gate_enter">Entra</button>
    <p class="gate__err hidden" id="gate-err" data-i18n="gate_err">Password non corretta</p>
  </div>
  <div class="gate__footer">
    <span>Pirri, Cagliari</span>
    <span>·</span>
    <span>Sardegna</span>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <header class="topbar">
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="#home">
      <span class="brand__small">Piccola</span><span class="brand__accent">bella</span><span class="brand__small">vista</span>
    </a>
    <div class="langs" role="group" aria-label="Lingua">
      <button data-lang="it" aria-label="Italiano" class="active">IT</button>
      <button data-lang="en" aria-label="English">EN</button>
      <button data-lang="de" aria-label="Deutsch">DE</button>
    </div>
  </header>

  <nav class="menu" id="menu" aria-label="Principale" aria-hidden="true" inert>
    <div class="menu__header">
      <span class="menu__label" data-i18n="nav_menu">Menu</span>
      <button class="menu__close" id="menu-close" aria-label="Chiudi menu">✕</button>
    </div>
    <ul class="menu__list" id="menu-list"></ul>
  </nav>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main id="view" class="view"></main>

  <footer class="foot">
    <div class="foot__links">
      <a href="#fonti" data-i18n="nav_fonti">Fonti e credits</a>
    </div>
    <p class="foot__copy">
      © Piccolabellavista · Pirri, Cagliari · <span data-i18n="foot_private">Guida privata</span>
    </p>
  </footer>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigazione rapida">
    <a href="#home" class="bottom-nav__item active" data-section="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="nav_home">Home</span>
    </a>
    <a href="#spiagge" class="bottom-nav__item" data-section="spiagge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M6 16l4-8 4 4 4-6"/><path d="M12 20V10"/></svg>
      <span data-i18n="nav_spiagge">Spiagge</span>
    </a>
    <a href="#cagliari" class="bottom-nav__item" data-section="cagliari">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      <span data-i18n="nav_cagliari">Cagliari</span>
    </a>
    <a href="#mangiare" class="bottom-nav__item" data-section="mangiare">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      <span data-i18n="nav_mangiare">Dove mangiare</span>
    </a>
    <a href="#eventi" class="bottom-nav__item" data-section="eventi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>
      <span data-i18n="nav_eventi">Eventi</span>
    </a>
    <button class="bottom-nav__item" id="bottom-more" type="button" aria-label="Altro">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span data-i18n="nav_altro">Altro</span>
    </button>
  </nav>

</div>

<!-- SHEET / MODAL -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet__backdrop" id="sheet-backdrop"></div>
  <div class="sheet__body">
    <div class="sheet__handle"></div>
    <button class="sheet__x" id="sheet-x" aria-label="Chiudi">✕</button>
    <div class="sheet__scroll" id="sheet-content"></div>
  </div>
</div>

<!-- FIX: prima il gate (position:fixed, z-index:1000) copriva sempre questo
     messaggio quando JS è disattivato, perché il gate resta nel markup a
     prescindere. z-index più alto + posizionamento fisso così è sempre
     leggibile in quel caso. -->
<noscript>
  <div style="position:fixed;inset:0;z-index:1002;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;font-family:Inter,sans-serif;background:#faf7f2;color:#4a4a48;">
    Questa guida richiede JavaScript attivo. / JavaScript is required. / JavaScript wird benötigt.
  </div>
</noscript>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  }
</script>
</body>
</html>
