name: Aumenta titolo mobile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enlarge-mobile-title.yml"

permissions:
  contents: write

jobs:
  enlarge-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aumenta leggermente il titolo su smartphone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          old = 'font-size: clamp(27px, 9.6vw, 42px);'
          new = 'font-size: clamp(30px, 10.4vw, 45px);'
          if old not in text:
              raise SystemExit('Regola attesa non trovata')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Registra la modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Aumenta leggermente il titolo mobile"
          git push
